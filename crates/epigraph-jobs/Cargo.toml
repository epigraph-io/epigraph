[package]
name = "epigraph-jobs"
description = "Background job runner and task processing for EpiGraph agentic framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
epigraph-db = { workspace = true }  # privatization repos and the statement-timeout helper
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }  # For async trait definitions
petgraph = { workspace = true }
rand = { workspace = true }  # used by Louvain to break ties between equal-modularity moves
sqlx = { workspace = true }  # PostgreSQL persistence for job queue
url = "2"  # WHATWG URL parsing for the webhook egress guard (already in graph via reqwest)
# The one sanctioned webhook HTTP client construction (`egress::pinned_client`),
# used by epigraph-api's delivery dispatcher. Same spec as epigraph-api's, so it
# adds a dependency edge and no new TLS stack.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
proptest = { workspace = true }

[features]
default = []
# Enable integration tests that require a live PostgreSQL database
integration = []
# Exposes `egress::EgressGuard::exempt_socket_for_tests`, which lets a test
# guard deliver to one exact local listener. Enable ONLY from
# [dev-dependencies]: a release build must not contain it.
test-support = []

[lints]
workspace = true
