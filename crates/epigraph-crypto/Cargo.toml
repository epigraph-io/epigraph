[package]
name = "epigraph-crypto"
description = "Cryptographic primitives for EpiGraph: BLAKE3 hashing, Ed25519 signing, canonical serialization"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `zeroize`: `keypair_from_llm_agent_keyed` wipes the keyed hash (the identity
# private key) and the keyed hasher (backlog 8bd859e5). The feature adds only
# `Zeroize` impls; it does not change any hash output.
blake3 = { workspace = true, features = ["zeroize"] }
bs58 = { workspace = true }  # Base58 encoding for did:key identifiers
ed25519-dalek = { workspace = true }
rand = { workspace = true }
subtle = { workspace = true }
aes-gcm = { workspace = true }
x25519-dalek = { workspace = true }
curve25519-dalek = { workspace = true }
sha2 = { workspace = true }
# `wrap_group_key`'s AAD binds a group id and a member agent id; both are UUIDs
# everywhere else in the tree, and taking them as `[u8; 16]` here would push the
# conversion (and the chance of transposing the two) onto every caller.
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Wipes the keyed identity hash (see `blake3` above). Already in the lock
# through ed25519-dalek; no new crate.
zeroize = "1"

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "crypto_benchmarks"
harness = false

[lints]
workspace = true
