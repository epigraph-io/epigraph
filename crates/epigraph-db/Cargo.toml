[package]
name = "epigraph-db"
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2021"

[dependencies]
# PR-02: AgentRepository::ensure_for_client derives the 32-byte placeholder
# public key for a keyless OAuth principal with blake3::derive_key. blake3 was
# already a dev-dependency below; this promotes it to a real one.
blake3 = { workspace = true }
# PR-02: ensure_for_client decodes an agent client's client_id, which IS its hex
# Ed25519 public key, to find the real signer row instead of minting a second
# derived principal beside it.
hex = { workspace = true }
epigraph-core = { workspace = true }
epigraph-crypto = { workspace = true }
epigraph-ds = { workspace = true }  # DS/TBM types for mass function persistence
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
futures = "0.3"
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
serde = { workspace = true }
epigraph-crypto = { workspace = true }

# Enable sqlx test fixtures
[[test]]
name = "lineage_tests"
path = "tests/lineage_tests.rs"

[[test]]
name = "batch_operations_tests"
path = "tests/batch_operations_tests.rs"

[[test]]
name = "cascade_delete_tests"
path = "tests/cascade_delete_tests.rs"

[[test]]
name = "edge_validation_tests"
path = "tests/edge_validation_tests.rs"

[[test]]
name = "claim_search_by_embedding"
path = "tests/claim_search_by_embedding.rs"

[[test]]
name = "match_candidate_migration"
path = "tests/match_candidate_migration.rs"

[[test]]
name = "last_match_scan_column"
path = "tests/last_match_scan_column.rs"

[[test]]
name = "match_candidate_repo"
path = "tests/match_candidate_repo.rs"
