[package]
name = "epigraph-cli"
description = "Command-line interface tools for EpiGraph data ingestion and analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["db"]
db = ["dep:epigraph-db", "dep:sqlx", "dep:epigraph-passkey"]
genai = ["db"]

[[bin]]
name = "recompute_claim_belief"
path = "src/bin/recompute_claim_belief.rs"
required-features = ["db"]

[[bin]]
name = "recompute_betp"
path = "src/bin/recompute_betp.rs"
required-features = ["db"]

[[bin]]
name = "ingest_literature"
path = "src/bin/ingest_literature.rs"

[[bin]]
name = "ingest_git"
path = "src/bin/ingest_git.rs"

[[bin]]
name = "embed_bridge"
path = "src/bin/embed_bridge.rs"

[[bin]]
name = "analyze_graph"
path = "src/bin/analyze_graph.rs"

[[bin]]
name = "compare_routes"
path = "src/bin/compare_routes.rs"

[[bin]]
name = "rerank_bridges"
path = "src/bin/rerank_bridges.rs"
required-features = ["genai"]

[[bin]]
name = "bridge_component"
path = "src/bin/bridge_component.rs"
required-features = ["genai"]

[[bin]]
name = "bridge_sweep"
path = "src/bin/bridge_sweep.rs"
required-features = ["genai"]

[[bin]]
name = "dekg"
path = "src/bin/dekg.rs"

[[bin]]
name = "method_search"
path = "src/bin/method_search.rs"
required-features = ["db"]

[[bin]]
name = "protocol_gen"
path = "src/bin/protocol_gen.rs"
required-features = ["db"]

[[bin]]
name = "hypothesis"
path = "src/bin/hypothesis.rs"
required-features = ["db"]

[[bin]]
name = "experiment"
path = "src/bin/experiment.rs"
required-features = ["db"]

[[bin]]
name = "reembed"
path = "src/bin/reembed.rs"
required-features = ["db"]

[[bin]]
name = "decompose_claims"
path = "src/bin/decompose_claims.rs"
required-features = ["db"]

[[bin]]
name = "prune_recall_events"
path = "src/bin/prune_recall_events.rs"
required-features = ["db"]

[[bin]]
name = "embed_backfill"
path = "src/bin/embed_backfill.rs"
required-features = ["db"]

[[bin]]
name = "cross_source_sweep"
path = "src/bin/cross_source_sweep.rs"
required-features = ["genai"]

[[bin]]
name = "calibrate_matcher"
path = "src/bin/calibrate_matcher.rs"
required-features = ["db"]

[[bin]]
name = "export_provenance"
path = "src/bin/export_provenance.rs"
required-features = ["db"]

[[test]]
name = "cross_source_sweep_smoke"
path = "tests/cross_source_sweep_smoke.rs"
required-features = ["genai"]

[[test]]
name = "recompute_betp_cohort"
path = "tests/recompute_betp_cohort.rs"
required-features = ["db"]

[[test]]
name = "operator_reown"
path = "tests/operator_reown.rs"
required-features = ["db"]

[[test]]
name = "recompute_betp_run"
path = "tests/recompute_betp_run.rs"
required-features = ["db"]

# Runs most of this crate's `db`-gated binaries' `--help`; without `db` their
# `CARGO_BIN_EXE_*` do not exist and the test would not compile.
[[test]]
name = "help_hides_env_values"
path = "tests/help_hides_env_values.rs"
required-features = ["db"]

[[bin]]
name = "bootstrap_clients"
path = "src/bin/bootstrap_clients.rs"
required-features = ["db"]

[[bin]]
name = "ingest-document"
path = "src/bin/ingest_document.rs"
required-features = ["db"]

[[bin]]
name = "backfill_factors"
path = "src/bin/backfill_factors.rs"
required-features = ["db"]

[[bin]]
name = "retire_match_candidates"
path = "src/bin/retire_match_candidates.rs"
required-features = ["db"]

# Migration 117 (batch W10): replay deferred administrative cascades on the
# maintenance connection.
[[bin]]
name = "replay_deferred_cascades"
path = "src/bin/replay_deferred_cascades.rs"
required-features = ["db"]

# Operator decision D9 (batch W12a): the semantic-duplicate sweep, moved off the
# MCP server (whose tool now answers MOVED) onto the maintenance connection,
# with every collapse audited through the administrative cascade.
[[bin]]
name = "sweep_semantic_duplicates"
path = "src/bin/sweep_semantic_duplicates.rs"
required-features = ["db"]

# PR-12's tenancy backfill. A [[bin]] here rather than a new
# `crates/epigraph-tenancy-backfill` workspace member, deliberately: the plan
# names the binary with no path, the PR's own title is `feat(cli)`, every
# comparable maintenance tool in this tree is a [[bin]] in this crate, and a new
# workspace member would need its own `.github/workflows/ci.yml` `--exclude` +
# serialized step (ci.yml is on PR-16's Files line, not PR-12's). The binary
# NAME is what migration 066's header and plan §9.2 invoke, and it is preserved
# exactly.
[[bin]]
name = "epigraph-tenancy-backfill"
path = "src/bin/tenancy_backfill.rs"
required-features = ["db"]

# `epigraph-instance-admin` (PR-18a). The only writer of `instance_admins`.
#
# The plan's Files line spells the SOURCE FILE `epigraph-instance-admin.rs`.
# That is against this crate's convention, which every other entry here follows:
# a snake_case path with a kebab-case `name`. The BINARY name is what plan 6.6
# and migration 083's header invoke and it is preserved exactly.
#
# `required-features = ["db"]` matches its sibling. `db` IS in this crate's
# default feature set, so `--workspace --all-targets` builds this target; the
# `genai`-gated targets are the ones the four gates miss, and this is not one.
[[bin]]
name = "epigraph-instance-admin"
path = "src/bin/instance_admin.rs"
required-features = ["db"]

# `epigraph-group` (PR-19): the client-side group key ceremony.
#
# The plan's Files line spells the SOURCE FILE `epigraph-group.rs`; as with
# `epigraph-instance-admin` above, this crate's convention is a snake_case path
# with a kebab-case `name`, and the BINARY name — which the group routes'
# documentation invokes as `--init-group` — is preserved exactly.
#
# NO `required-features`, and that is deliberate rather than an omission: this
# binary constructs no pool, names no database type, and must build with the
# `db` feature off. Note what that does and does not buy. The SOURCE is DB-free,
# which is why `no_unmaintained_dsn.rs` passes it without an exemption row. The
# CRATE is not: `default = ["db"]` links epigraph-db and sqlx, and Cargo
# dependencies are per-crate, not per-target, so the compiled artifact carries
# them. "Never linked into the server" is a property of where the key material
# goes, not something this manifest can enforce.
# `epigraph-operator`: the one-time operator ownership backfill (retired links,
# claim re-own, and its manifest-driven reversal). Same convention as its
# siblings: a snake_case path with a kebab-case `name`. `required-features =
# ["db"]` because every subcommand opens a maintenance pool.
[[bin]]
name = "epigraph-operator"
path = "src/bin/operator.rs"
required-features = ["db"]

[[bin]]
name = "epigraph-group"
path = "src/bin/group.rs"

[dependencies]
epigraph-core = { workspace = true }
epigraph-engine = { workspace = true }
epigraph-crypto = { workspace = true }
epigraph-privacy = { workspace = true }  # epigraph-group's ceremony types
ed25519-dalek = { workspace = true }
epigraph-embeddings = { workspace = true }
epigraph-interfaces = { workspace = true }
epigraph-ds = { workspace = true }
epigraph-mcp = { workspace = true }
epigraph-ingest = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
epigraph-db = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
# `epigraph-operator verify-confirmations` (elevation plan EL-13): re-verifies
# every stored passkey assertion offline. Links OpenSSL (webauthn-rs-core);
# only behind `db`, which every operator verb already needs.
epigraph-passkey = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
csv = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
hex = "0.4"
dotenvy = "0.15"
base64 = "0.22"
blake3 = { workspace = true }
rand = { workspace = true }
linfa = { workspace = true }
linfa-clustering = { workspace = true }
ndarray = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
sqlx = { workspace = true }
# PR-hierarchical ingest integration test (tests/pr_hierarchical_ingest_test.rs):
# oneshot the real epigraph-api handlers the CLI hits against epigraph_db_repo_test.
epigraph-api = { workspace = true }
axum = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# decompose_claims's mint_service_token unit tests (src/bin/decompose_claims.rs):
# same pin epigraph-api/Cargo.toml already uses for its OAuth provider tests,
# so this adds no new dependency version to the lockfile.
wiremock = "0.6"
# `tests/operator_admin_act_cli.rs`'s end-to-end act (elevation plan EL-12b):
# the real API router proposes and confirms an act with the test
# authenticator shared with `epigraph-passkey`'s tests (`#[path]` to its
# `tests/support/soft_authenticator.rs`, written on OpenSSL and ciborium), and
# the real `epigraph-operator` binary executes it. Dev-only, all already in
# the lockfile: no normal build of this crate links them.
epigraph-passkey = { workspace = true }
epigraph-auth = { workspace = true }
# test-support: the application-role ScopedPool that declares the per-access
# recorder (the router the end-to-end act runs on elevates only on one).
epigraph-db = { workspace = true, features = ["test-support"] }
openssl = "0.10"
ciborium = "0.2"
url = "2"

[lints]
workspace = true

# `epigraph-privatize` (PR-21): the client half of the D4 seal ceremony.
#
# Same naming convention as its two siblings above: a snake_case path with a
# kebab-case `name`. FINAL-PLAN §6.5.7 spells the source file
# `epigraph-privatize.rs`; the BINARY name is what the plan invokes and it is
# preserved exactly.
#
# NO `required-features`, for the same reason `epigraph-group` has none and with
# the same caveat: the SOURCE opens no pool, names no database type and reads no
# `DATABASE_URL` — which is why `no_unmaintained_dsn.rs` passes it without an
# exemption row — while the CRATE still links epigraph-db through
# `default = ["db"]`, because Cargo dependencies are per-crate and not
# per-target. "The key never reaches a process the operator controls" is a
# property of where this binary is RUN, not something this manifest enforces.
[[bin]]
name = "epigraph-privatize"
path = "src/bin/privatize.rs"
