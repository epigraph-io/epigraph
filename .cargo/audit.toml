# cargo-audit ignore-list — triage of known RustSec advisories in Cargo.lock.
#
# The "Security audit (advisory)" CI job (.github/workflows/ci.yml) runs
# `cargo audit` and is intentionally `continue-on-error: true` — advisory, not a
# merge gate. (Foreman auto-merges epigraph PRs, so a hard gate would let any
# newly-published transitive advisory red-light unrelated PRs.) This file lets
# the job go GREEN on the *currently-triaged* advisories, so a genuinely NEW
# advisory still turns it red as actionable signal rather than drowning in a
# permanently-red check.
#
# Remove entries from a "deferred" group as the migration that clears them
# lands; re-review the "no fix" group periodically in case upstream ships a
# patch. The sqlx 0.7->0.8 + reqwest 0.11->0.12 migrations (issue #287, backlog
# a2fa31b1-b733-4f32-bdc2-6a0f0bd4c4ef) have landed, and their five suppressions
# are gone from the list below — those advisories are now genuinely fixed rather
# than suppressed.

[advisories]
ignore = [
    # ── No fix available — accepted risk ────────────────────────────────────
    "RUSTSEC-2023-0071", # rsa: Marvin timing side-channel. No fixed upstream
                         #   release exists. Pulled by jsonwebtoken's
                         #   `rust_crypto` backend into epigraph-auth,
                         #   epigraph-api and epigraph-mcp
                         #   (`cargo tree -i rsa -e normal --workspace`), and
                         #   by epigraph-api's dev-only RSA test fixture.
                         #   Accepted because Marvin attacks RSA PRIVATE-key
                         #   operations, and production holds no RSA private
                         #   key: RS256 is verify-only, against Google /
                         #   Cloudflare Access public keys
                         #   (DecodingKey::from_rsa_components in
                         #   epigraph-api oauth/providers/google.rs and
                         #   cloudflare_access.rs), and epigraph's own tokens
                         #   are signed HS256 (epigraph-auth JwtConfig). An RSA
                         #   private key outside tests re-opens this entry.
    "RUSTSEC-2024-0384", # instant: unmaintained. Transitive via `ascent`
                         #   (Datalog engine) — not removable by us.
    "RUSTSEC-2024-0436", # paste: unmaintained. Transitive via `ascent`.

    # ── Fix needs a major bump — dismissed until needed ─────────────────────
    "RUSTSEC-2026-0387", # crypto-bigint 0.5.5: timing variability in
                         #   operations meant to be constant-time; fixed in
                         #   >=0.7.6. 2026-10-26 operator ruling R-26:
                         #   accepted, not bumped. Chain: jsonwebtoken's
                         #   `rust_crypto` backend -> p256 / p384 ->
                         #   elliptic-curve 0.13 -> crypto-bigint 0.5 (NOT
                         #   via rsa, which uses num-bigint-dig). The fix
                         #   needs elliptic-curve 0.14, i.e. a jsonwebtoken
                         #   major. Unreachable with secret inputs: no crate
                         #   constructs an EC key (no EncodingKey/DecodingKey
                         #   ::from_ec_*, no from_jwk), and every Validation
                         #   pins RS256 (Google / Cloudflare Access public
                         #   keys) or HS256 (epigraph-auth), so the ES256 /
                         #   ES384 code paths never run, and an EC VERIFY
                         #   would handle public data only. An EC private key
                         #   or an ES* algorithm in production re-opens this
                         #   entry. Revisit on the next jsonwebtoken /
                         #   elliptic-curve (or rsa) major.

    # ── FIXED, not suppressed (issue #287) ──────────────────────────────────
    # RUSTSEC-2024-0363 (sqlx 0.7.4 binary-protocol cast),
    # RUSTSEC-2026-0098 / -0099 (rustls-webpki 0.101.7 name-constraint),
    # RUSTSEC-2026-0104 (rustls-webpki 0.101.7 CRL-parse panic) and
    # RUSTSEC-2025-0134 (rustls-pemfile unmaintained) were suppressed here
    # pending the TLS/DB dependency migration. That migration has landed —
    # Cargo.lock now resolves sqlx 0.8.6, reqwest 0.12.28, rustls 0.23.x and
    # rustls-webpki 0.103.x, none of which are in the other four advisories'
    # affected ranges — so the suppressions are deleted rather than carried.
    # Do not re-add RUSTSEC-2024-0363 / 2026-0098 / -0099 / -0104: a
    # reappearance means a dependency regressed onto the old TLS/DB stack and
    # `cargo audit` should say so.
    #
    # RUSTSEC-2025-0134 (rustls-pemfile unmaintained) is CLEARED, not
    # suppressed (2026-10-26, operator ruling R-26): epigraph-api's TLS loader
    # (src/tls.rs) parses PEM with rustls-pki-types' PemObject API, and
    # axum-server 0.8 dropped its own rustls-pemfile dependency, so Cargo.lock
    # no longer contains the crate. `cargo audit` would report a return only
    # as a non-failing warning, so the ratchet is
    # crates/epigraph-api/tests/tls_dependency_boundary.rs. Do not add an
    # ignore entry for it.
    #
    # rustls 0.23.45 (RUSTSEC-2026-0346 / -0347 / -0348 / -0349),
    # rustls-webpki 0.103.15 (RUSTSEC-2026-0382) and webpki-roots 1.0.8
    # (RUSTSEC-2026-0381) were cleared by semver-compatible lockfile bumps
    # (rustls 0.23.46, rustls-webpki 0.103.16, webpki-roots 1.0.11). They
    # were never suppressed; do not add them.
    #
    # RUSTSEC-2026-0097 (rand unsound with a custom logger; GHSA-cq8v-f236-94qc)
    # was suppressed here while Cargo.lock resolved rand 0.8.5 and 0.9.2. The
    # patched releases 0.8.6 and 0.9.3 are semver-compatible, so Cargo.lock now
    # resolves them and the suppression is deleted. rand 0.10.x is outside the
    # affected range. Do not re-add it.
    #
    # RUSTSEC-2026-0189 (rmcp streamable-HTTP server DNS rebinding, fixed in
    # rmcp >=1.4.0) was suppressed here pending the rmcp 0.x -> 1.x migration.
    # That migration has landed: the workspace requires rmcp 2.2 and Cargo.lock
    # resolves rmcp 2.2.0, so the entry matched nothing and is deleted. The
    # MCP HTTP endpoint still relies on bearer-token checks at the proxy; that
    # control does not depend on this entry.
]

# ── GitHub advisories with no RustSec ID (Dependabot only) ─────────────────
# `cargo audit` reads only the RustSec DB, so these advisories never reach the
# ignore list above. Dependabot still raises them, so their triage is recorded
# here, as comments only, to keep one place that explains every open
# dependency alert.
#
# GHSA-w9wp-h8wv-79jx / CVE-2026-48504, opentelemetry_sdk <=0.32.0 (Cargo.lock:
#   0.27.1; Dependabot alerts #13 on Cargo.lock and #16 on
#   crates/epigraph-api/Cargo.toml). 2026-10-26 operator ruling R-26:
#   DISMISSED UNTIL NEEDED, not bumped, for the reasons below; revisit on the
#   next otel major or when the `otel` pipeline is wired up. Unbounded allocation in `BaggagePropagator::extract_with_context`
#   on an oversized inbound `baggage` header (availability only). NOT REACHABLE:
#   - opentelemetry_sdk is pulled only by epigraph-api's optional `otel`
#     feature, which is not a default feature. `cargo tree -i opentelemetry_sdk
#     --workspace -e normal` matches no package without `--features
#     epigraph-api/otel`.
#   - With the feature on, the server.rs `otel` block calls no OpenTelemetry
#     API (the pipeline is a commented-out TODO). No crate constructs a
#     BaggagePropagator or TextMapPropagator, or calls
#     set_text_map_propagator / extract_with_context.
#   - epigraph-mcp/src/otel.rs is not in the module tree (no `mod otel`), and
#     it builds an exporter only, not a propagator.
#   Fix = opentelemetry/opentelemetry_sdk/opentelemetry-otlp 0.27 -> >=0.32.1
#   plus the matching tracing-opentelemetry. That is a breaking API move, not
#   a lockfile bump. Revisit this entry when the `otel` pipeline is wired up,
#   or when anything starts extracting inbound trace context.
#
# GHSA-7gcf-g7xr-8hxj, serde_with <3.21.0 (KeyValueMap panic). FIXED: Cargo.lock
#   resolves serde_with 3.21.0. Do not let it fall back below that version.
