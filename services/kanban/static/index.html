<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>EpiGraph Backlog</title>
<style>
:root {
  --bg: #f5f6f8;
  --col-bg: #eceef2;
  --surface: #ffffff;
  --surface-2: #f3f4f7;
  --surface-3: #e9ebef;
  --border: #e1e4e9;
  --border-strong: #c9ced6;
  --text: #1b1f24;
  --text-2: #57606b;
  --text-3: #8a929c;
  --accent: #4a5bd4;
  --accent-hover: #3d4dc0;
  --accent-weak: #eceffd;
  --on-accent: #ffffff;
  --on-status: #ffffff;
  --red: #cf3f3a;
  --red-weak: #fdeceb;
  --amber: #a86a12;
  --amber-weak: #fcf2df;
  --green: #2b8453;
  --green-weak: #e5f4ec;
  --blue: #2667d6;
  --blue-weak: #e7effd;
  --purple: #7547c9;
  --purple-weak: #f0eafc;
  --teal: #177f86;
  --teal-weak: #e1f3f4;
  --shadow-sm: 0 1px 0 rgba(20, 24, 31, .04), 0 1px 2px rgba(20, 24, 31, .05);
  --shadow-lg: 0 12px 40px rgba(20, 24, 31, .16), 0 2px 8px rgba(20, 24, 31, .08);
  --log-bg: #fafbfc;
  --focus: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317;
    --col-bg: #16191e;
    --surface: #1c2026;
    --surface-2: #232830;
    --surface-3: #2b313a;
    --border: #2c323b;
    --border-strong: #3c444f;
    --text: #e6e8eb;
    --text-2: #a3abb5;
    --text-3: #707984;
    --accent: #7d8bf0;
    --accent-hover: #919df3;
    --accent-weak: #262b4a;
    --on-accent: #0f1220;
    --on-status: #14161a;
    --red: #f07670;
    --red-weak: #3a1f1f;
    --amber: #e3ad55;
    --amber-weak: #372a15;
    --green: #5cc58c;
    --green-weak: #173125;
    --blue: #6aa2f5;
    --blue-weak: #1a2a44;
    --purple: #b193f2;
    --purple-weak: #2b2344;
    --teal: #5cc7cc;
    --teal-weak: #16312f;
    --shadow-sm: 0 1px 0 rgba(0, 0, 0, .25);
    --shadow-lg: 0 16px 48px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .3);
    --log-bg: #15181d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --col-bg: #16191e; --surface: #1c2026; --surface-2: #232830; --surface-3: #2b313a;
  --border: #2c323b; --border-strong: #3c444f; --text: #e6e8eb; --text-2: #a3abb5; --text-3: #707984;
  --accent: #7d8bf0; --accent-hover: #919df3; --accent-weak: #262b4a; --on-accent: #0f1220; --on-status: #14161a;
  --red: #f07670; --red-weak: #3a1f1f; --amber: #e3ad55; --amber-weak: #372a15; --green: #5cc58c; --green-weak: #173125;
  --blue: #6aa2f5; --blue-weak: #1a2a44; --purple: #b193f2; --purple-weak: #2b2344; --teal: #5cc7cc; --teal-weak: #16312f;
  --shadow-sm: 0 1px 0 rgba(0, 0, 0, .25); --shadow-lg: 0 16px 48px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .3);
  --log-bg: #15181d; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
.grow { flex: 1 1 auto; }
.muted { color: var(--text-3); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 6px; }
svg.ic { flex: none; display: block; }

/* ---------- buttons & inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 28px; padding: 0 10px;
  border: 1px solid var(--border-strong); border-radius: 6px;
  background: var(--surface); color: var(--text);
  font: inherit; font-weight: 500; white-space: nowrap; cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, var(--border)); }
.btn.danger:hover:not(:disabled) { background: var(--red-weak); }
.btn.danger.solid { background: var(--red); color: var(--on-status); border-color: var(--red); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.btn.sm { height: 24px; padding: 0 8px; font-size: 12px; gap: 4px; }
.btn.xs { height: 22px; padding: 0 6px; font-size: 11.5px; gap: 4px; border-radius: 5px; }
.btn.icon { width: 28px; padding: 0; }
.btn.sm.icon { width: 24px; }
.btn.on { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); }

input[type="text"], input[type="search"], textarea, select {
  font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--border-strong); border-radius: 6px;
  padding: 4px 8px; min-height: 28px;
}
textarea { width: 100%; resize: vertical; line-height: 1.45; padding: 7px 9px; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; margin: 0; cursor: pointer; }
label.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-2); user-select: none; }

/* ---------- pills, chips, flags ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  height: 20px; padding: 0 7px; border-radius: 999px;
  font-size: 11px; font-weight: 600; white-space: nowrap;
  background: var(--surface-3); color: var(--text-2);
}
.pill.blue { background: var(--blue-weak); color: var(--blue); }
.pill.amber { background: var(--amber-weak); color: var(--amber); }
.pill.purple { background: var(--purple-weak); color: var(--purple); }
.pill.green { background: var(--green-weak); color: var(--green); }
.pill.red { background: var(--red-weak); color: var(--red); }
.pill.teal { background: var(--teal-weak); color: var(--teal); }
.pill.accent { background: var(--accent-weak); color: var(--accent); }
.pill.outline { background: transparent; border: 1px solid var(--border-strong); font-weight: 500; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.dot.pulse { animation: pulse 1.6s ease-out infinite; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 55%, transparent); }
  70% { box-shadow: 0 0 0 5px color-mix(in srgb, currentColor 0%, transparent); }
  100% { box-shadow: 0 0 0 0 transparent; }
}
.chip {
  display: inline-flex; align-items: center; height: 18px; padding: 0 6px;
  border-radius: 4px; font-size: 11px; line-height: 1;
  background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border);
  white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis;
}
.chip.l-bug { background: var(--red-weak); color: var(--red); border-color: transparent; }
.chip.l-feature-request { background: var(--blue-weak); color: var(--blue); border-color: transparent; }
.chip.l-security { background: var(--amber-weak); color: var(--amber); border-color: transparent; }
.flag {
  display: inline-flex; align-items: center; gap: 3px;
  height: 20px; padding: 0 6px; border-radius: 5px;
  background: var(--red); color: var(--on-status); font-size: 11px; font-weight: 700;
}
.flag.warn { background: var(--amber-weak); color: var(--amber); }

/* ---------- header ---------- */
header.top {
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px; height: 52px; flex: none;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 14.5px; letter-spacing: -.01em; }
.brand-mark {
  width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent);
}
.hdr-stat { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 12px; }
.hdr-stat b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.meter { display: inline-flex; gap: 2px; }
.meter i { width: 6px; height: 12px; border-radius: 2px; background: var(--surface-3); }
.meter i.on { background: var(--blue); }
.sep { width: 1px; height: 20px; background: var(--border); }
.integ-pill {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
  border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface-2);
  color: var(--text); font: inherit; font-size: 12px; cursor: pointer; max-width: 360px;
}
.integ-pill:hover { border-color: var(--accent); }
.integ-pill[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-weak); }
.integ-pill .mono { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.integ-pill .none { color: var(--text-3); }

.banner {
  flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 16px; font-size: 12.5px; border-bottom: 1px solid var(--border);
}
.banner.demo { background: var(--purple-weak); color: var(--purple); }
.banner.err { background: var(--red-weak); color: var(--red); }
.banner input { min-width: 260px; }

/* ---------- toolbar ---------- */
.toolbar {
  flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.search { position: relative; display: flex; align-items: center; }
.search svg { position: absolute; left: 8px; color: var(--text-3); pointer-events: none; }
.search input { padding-left: 28px; width: 240px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.chips.label-row { flex: 1 1 200px; min-width: 0; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 2px 0;
  mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); }
.chips.label-row::-webkit-scrollbar { display: none; }
.fchip {
  display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px;
  border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
  color: var(--text-2); font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap;
}
.fchip:hover { border-color: var(--border-strong); color: var(--text); }
.fchip[aria-pressed="true"] { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); }
.fchip .n { color: var(--text-3); font-variant-numeric: tabular-nums; font-size: 11px; }
.fchip[aria-pressed="true"] .n { color: inherit; opacity: .75; }
.fchip.bug[aria-pressed="true"] { background: var(--red-weak); border-color: var(--red); color: var(--red); }
.fchip.blk[aria-pressed="true"] { background: var(--red-weak); border-color: var(--red); color: var(--red); }
.refresh-meta { font-size: 12px; color: var(--text-3); display: inline-flex; align-items: center; gap: 6px; }
.refresh-meta .err { color: var(--red); max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spin { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- integration panel ---------- */
.integ {
  flex: none; background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 14px 16px 16px; max-height: 48vh; overflow: auto;
}
.integ-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.integ-head h2 { font-size: 13.5px; margin: 0; font-weight: 650; }
.integ-head p { margin: 0; color: var(--text-3); font-size: 12px; }
.integ-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; }
@media (max-width: 980px) { .integ-grid { grid-template-columns: 1fr; } }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul { margin-left: 13px; padding-left: 20px; border-left: 1px solid var(--border-strong); }
.tree li { position: relative; padding: 4px 0; }
.tree ul > li::before {
  content: ""; position: absolute; left: -20px; top: 19px; width: 16px;
  border-top: 1px solid var(--border-strong);
}
.tree ul > li:last-child::after {
  content: ""; position: absolute; left: -21px; top: 20px; bottom: 0; width: 3px; background: var(--surface);
}
.tnode {
  display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap;
  min-height: 30px; padding: 4px 10px; max-width: 100%;
  border: 1px solid var(--border); border-radius: 7px; background: var(--surface);
}
.tnode.root { background: var(--surface-2); font-weight: 600; }
.tnode.integration { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
.tnode.empty { border-style: dashed; color: var(--text-3); }
.tnode .t-title { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 420px; background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-align: left; }
.tnode .t-title:hover { color: var(--accent); }
.tnode .arrow { color: var(--text-3); font-size: 11px; }
.checks { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--text-2); }
.checks .dot { width: 7px; height: 7px; }
.checks.pass { color: var(--green); } .checks.fail { color: var(--red); } .checks.pending { color: var(--amber); } .checks.none { color: var(--text-3); }
.side-box { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--surface-2); }
.side-box + .side-box { margin-top: 10px; }
.side-box h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); font-weight: 650; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; font-size: 12px; margin: 0; }
.kv dt { color: var(--text-3); white-space: nowrap; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.integ-actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- board ---------- */
main.board {
  flex: 1 1 auto; min-height: 0;
  display: grid; grid-template-columns: repeat(5, minmax(272px, 1fr)); gap: 12px;
  padding: 12px 16px 16px; overflow-x: auto; overflow-y: hidden;
}
@media (min-width: 1760px) { body.drawer-open main.board { padding-right: calc(560px + 16px); } }
.col {
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
  background: var(--col-bg); border-radius: 10px; border: 1px solid transparent;
  transition: background .12s, border-color .12s;
}
.col.drop-ok { border: 1px dashed var(--accent); background: var(--accent-weak); }
.col.drop-no { border: 1px dashed var(--red); }
.col-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px; font-weight: 650; font-size: 12.5px; }
.col-head .ci { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.col-head .sub { font-weight: 500; color: var(--text-3); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.count { font-weight: 600; font-size: 11px; color: var(--text-2); background: var(--surface-3); border-radius: 999px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
.col-body { flex: 1 1 auto; overflow-y: auto; padding: 2px 8px 12px; display: flex; flex-direction: column; gap: 8px; }
.col-empty { color: var(--text-3); font-size: 12px; text-align: center; padding: 22px 10px; border: 1px dashed var(--border-strong); border-radius: 8px; }
.col-more { color: var(--text-3); font-size: 11.5px; text-align: center; padding: 6px; }

.card {
  position: relative; display: flex; flex-direction: column; gap: 6px;
  padding: 9px 10px 8px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow-sm);
  cursor: pointer; transition: border-color .12s, box-shadow .12s;
}
.card:hover { border-color: var(--border-strong); }
.card.open { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card.selected { background: color-mix(in srgb, var(--accent-weak) 70%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.card.blocked { box-shadow: inset 3px 0 0 var(--red), var(--shadow-sm); }
.card.blocked.open { box-shadow: inset 3px 0 0 var(--red), 0 0 0 1px var(--accent); }
.card.stale { opacity: .62; }
.card.dragging { opacity: .45; }
.c-top { display: flex; align-items: center; gap: 6px; min-height: 20px; }
.cid { color: var(--text-3); font-size: 11px; }
.elapsed { color: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.c-title {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  background: none; border: 0; padding: 0; margin: 0; text-align: left; color: var(--text);
  font: inherit; font-weight: 550; font-size: 13px; line-height: 1.38; cursor: pointer; overflow-wrap: anywhere;
}
.c-labels { display: flex; flex-wrap: wrap; gap: 4px; }
.c-activity {
  display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--blue);
  background: var(--blue-weak); border-radius: 5px; padding: 3px 7px; min-width: 0;
}
.c-activity span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.c-foot { display: flex; align-items: center; gap: 6px; min-height: 22px; }
.c-foot .pr { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; }
.c-actions { display: flex; gap: 4px; margin-left: auto; }

/* ---------- drawer ---------- */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 40;
  width: min(560px, 100vw); display: flex; flex-direction: column;
  background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow-lg);
  animation: slidein .16s ease-out;
}
.drawer[hidden] { display: none; }
@keyframes slidein { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.dr-head { padding: 12px 16px 10px; border-bottom: 1px solid var(--border); flex: none; }
.dr-idrow { display: flex; align-items: center; gap: 6px; color: var(--text-3); }
.dr-head h2 { margin: 6px 0 8px; font-size: 15.5px; line-height: 1.35; font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; }
.dr-head h2:focus-visible { box-shadow: none; outline: none; }
.dr-pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.dr-actions { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--border); flex: none; align-items: center; }
.dr-actions:empty { display: none; }
.dr-actions .note { color: var(--text-2); font-size: 12px; }
.composer { padding: 10px 16px 12px; border-bottom: 1px solid var(--border); background: var(--surface-2); flex: none; }
.composer[hidden] { display: none; }
.composer label { display: block; font-weight: 600; font-size: 12px; margin-bottom: 6px; }
.composer .row { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; align-items: center; }
.composer .hint { color: var(--text-3); font-size: 11.5px; margin-right: auto; }
.tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--border); flex: none; }
.tab {
  background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 8px 8px;
  font: inherit; font-weight: 550; color: var(--text-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tab .count { font-size: 10.5px; }
.dr-body { flex: 1 1 auto; overflow-y: auto; }
.dr-sec { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.dr-sec:last-child { border-bottom: 0; }
.dr-sec h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); font-weight: 650; display: flex; align-items: center; gap: 6px; }
.content { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.55; margin: 0; }
.prose-sm { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12.5px; margin: 0; color: var(--text); }
.subhead { font-size: 11.5px; font-weight: 600; color: var(--text-2); margin: 10px 0 4px; }
.subhead:first-child { margin-top: 0; }

.copyable { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; }

.timeline li::after { content: ""; position: absolute; left: 7px; top: 15px; bottom: 0; width: 1px; background: var(--border); }

.timeline li:first-child::before { background: var(--accent); }
.tl-ev { font-weight: 600; font-size: 12.5px; }
.tl-ts { color: var(--text-3); font-size: 11px; margin-left: 6px; }

.logline.kind-result .k, .logline.kind-result .t { color: var(--green); }

/* ================= board ================= */
var colEls = {};

function matches(c) {
  if (ui.search) {
    var hay = (titleOf(c) + ' ' + (c.content || '') + ' ' + c.labels.join(' ') + ' ' + c.id + ' ' + (c.branch || '')).toLowerCase();
    var toks = ui.search.toLowerCase().split(/\s+/).filter(Boolean);
    for (var i = 0; i < toks.length; i++) if (hay.indexOf(toks[i]) < 0) return false;
  }
  if (ui.labels.size && !c.labels.some(function (l) { return ui.labels.has(l); })) return false;
  if (ui.hasBlockers && !hardBlockers(c).length) return false;
  if (ui.hideStale && c.stale) return false;

}
function visibleBacklog() {
  return S ? S.cards.filter(function (c) { return c.column === 'backlog' && !isBusy(c) && matches(c); }) : [];
}
function sortCol(key, list) {
  if (key === 'backlog') {
    list.sort(function (a, b) {
      if (ui.sort === 'truth') return (b.truth_value == null ? -1 : b.truth_value) - (a.truth_value == null ? -1 : a.truth_value);
      var d = (tsOf(b.created_at) || 0) - (tsOf(a.created_at) || 0);
      return ui.sort === 'oldest' ? -d : d;
    });
  } else if (key === 'develop') {
    var rank = { running: 0, merging: 0, queued: 1 };
    list.sort(function (a, b) {
      var ra = rank[a.status] != null ? rank[a.status] : 2, rb = rank[b.status] != null ? rank[b.status] : 2;
      return ra - rb || lastTs(b) - lastTs(a);
    });
  } else {
    list.sort(function (a, b) { return lastTs(b) - lastTs(a); });
  }
  return list;
}

function renderBoard() {
  var by = {}, totals = {};
  COLS.forEach(function (c) { by[c.key] = []; totals[c.key] = 0; });
  S.cards.forEach(function (c) {
    if (!by[c.column]) return;
    totals[c.column]++;
    if (matches(c)) by[c.column].push(c);
  });
  var seen = new Set();
  COLS.forEach(function (col) {
    var ce = colEls[col.key];
    var list = sortCol(col.key, by[col.key]);
    var limit = col.key === 'shipped' ? 60 : 400;
    var shown = list.slice(0, limit);
    ce.count.textContent = shown.length === totals[col.key] ? String(totals[col.key]) : list.length + ' / ' + totals[col.key];
    if (col.key === 'accepted') ce.sub.textContent = S.integration.branch ? '→ ' + S.integration.branch : '→ staging';
    var els = shown.map(function (c) { seen.add(c.id); return cardEl(c); });
    if (!shown.length) {
      ce.empty.textContent = totals[col.key] ? 'No cards match the filters' : emptyText(col.key);
      els.push(ce.empty);
    }
    if (list.length > shown.length) { ce.more.textContent = (list.length - shown.length) + ' older cards not shown'; els.push(ce.more); }
    reconcile(ce.body, els);
    if (ce.selAll) {
      var vis = visibleBacklog();
      var nsel = vis.filter(function (c) { return selected.has(c.id); }).length;
      ce.selAll.checked = vis.length > 0 && nsel === vis.length;
      ce.selAll.indeterminate = nsel > 0 && nsel < vis.length;

function emptyText(key) {

    review: 'Agent results land here for review.',
    accepted: 'Accepted items are merged into the integration branch.',
    shipped: 'Nothing shipped yet.'

}
function reconcile(parent, els) {

  Array.prototype.slice.call(parent.children).forEach(function (ch) { if (!keep.has(ch)) ch.remove(); });
  els.forEach(function (el, i) { if (parent.children[i] !== el) parent.insertBefore(el, parent.children[i] || null); });
}

function elapsedOf(c) {

}

    c.blockers.map(function (b) { return [b.id, b.resolved, b.severity]; }),
    c.pr_url, c.pr_number, c.last_activity, elapsedOf(c), selected.has(c.id), drawer.id === c.id]);
}

function buildCard(c) {

/* ================= drag & drop mapping ================= */
function dropAction(from, to) {
  if (from === to) return null;
  if (from === 'backlog' && to === 'develop') return 'develop';
  if (from === 'review' && to === 'accepted') return 'accept';
  if (from === 'review' && to === 'develop') return 'feedback';
  if ((from === 'develop' || from === 'review') && to === 'backlog') return 'reject';
  return false;
}
function handleDrop(id, from, to) {
  var a = dropAction(from, to);
  if (a === null) return;
  if (a === false) { toast('Not allowed: ' + COLNAME[from] + ' → ' + COLNAME[to], 'warn'); render(); return; }
  if (a === 'develop') {
    if (selected.has(id) && selected.size > 1) developSelected();
    else developCard(id);
  } else if (a === 'accept') acceptCard(id);
  else if (a === 'feedback') feedbackCard(id);
  else if (a === 'reject') rejectCard(id);
}

/* ================= actions ================= */
function cpath(id, rest) { return '/api/cards/' + encodeURIComponent(id) + rest; }
function run(promise, okMsg) {
  return promise.then(function (r) { if (okMsg) toast(okMsg, 'ok'); refreshSoon(); return r || true; })
    .catch(function (e) { toast(e.message, 'error'); refreshSoon(); return null; });
}
function developCard(id, notes) {
  var body = {}; if (notes) body.notes = notes;
  var c = cardById(id);
  return run(api('POST', cpath(id, '/develop'), body), 'Dispatched agent for ' + short(id) + (c ? ': ' + titleOf(c).slice(0, 60) : ''));
}
function developSelected() {
  var ids = Array.from(selected);

  var max = maxAgents();
  dialog({
    title: 'Develop ' + ids.length + ' item' + (ids.length > 1 ? 's' : ''),
    body: [
      h('p', { text: 'Each item gets its own worktree and headless ultracode agent. At most ' + max + ' run at once; the rest queue in order.' }),
      h('ul', null, ids.slice(0, 8).map(function (id) { var c = cardById(id); return h('li', null, h('span', { class: 'mono', text: short(id) + ' ' }), c ? titleOf(c) : ''); }),
        ids.length > 8 ? h('li', { text: '…and ' + (ids.length - 8) + ' more' }) : null),

  hist(a2, 'accepted', 'merged PR #416 into ' + INTEG, 150);

  // Shipped
  var s1 = withPr(mk({ content: 'Make /claims/:id/ego total_edges redaction-aware so hidden neighbours are not counted.', labels: ['security', 'api', 'redaction'], truth_value: 0.88, created_at: ago(60 * 24 * 14), column: 'shipped', status: 'merged', started_at: ago(60 * 24 * 7), finished_at: ago(60 * 24 * 7 - 50), integration_branch: 'integration/kanban-2026-09-11', cost_usd: 2.9,
    summary: 'total_edges now counts only visible edges.', verification: 'cargo test -p epigraph-api ego -> 11 passed' }), 401);
  hist(s1, 'shipped', 'integration/kanban-2026-09-11 merged to main (PR #405)', 60 * 24 * 6);
  hist(s1, 'backlog_resolved', 'resolve_backlog_item ok', 60 * 24 * 6);

  // seed logs
  Object.keys(st.cards).forEach(function (id) {
    var c = st.cards[id];
    if (c.column === 'backlog') return;
    logs[id] = [];
    log(c, 'system', 'init: session ' + c.session_id + ' cwd=' + c.worktree);
    log(c, 'assistant', 'ultracode: reading the backlog claim and repo CLAUDE.md before planning.');
    log(c, 'tool', 'Read: CLAUDE.md');
    log(c, 'tool', 'Grep: "' + c.title.split(' ').slice(0, 2).join(' ') + '"');
    log(c, 'assistant', 'Plan: 1) locate the code path 2) add a failing test against epigraph_db_repo_test 3) fix 4) cargo check 5) push and open PR into ' + (c.integration_branch || INTEG) + '.');
    log(c, 'tool', 'Workflow: spawning 3 agents (implement, test, review)');
    log(c, 'tool', 'Bash: cargo check -p epigraph-api');
    if (c.status === 'failed') { log(c, 'stderr', 'error[E0599]: no method named `is_deprecated` found for struct `WorkflowStep`'); log(c, 'result', 'exit code 1 (no report.json)'); }
    else if (c.column !== 'develop') { log(c, 'tool', 'Bash: gh pr create --base ' + (c.integration_branch || INTEG)); log(c, 'result', 'done. cost $' + (c.cost_usd || 0).toFixed(2)); }
  });

  var ACTS = ['Read: crates/epigraph-db/src/repos/claim.rs', 'Grep: "redact_labels"', 'Edit: crates/epigraph-api/src/routes/neighborhood.rs',
    'Bash: cargo check -p epigraph-api', 'Bash: cargo test -p epigraph-api compound_neighborhood', 'Workflow: 3 reviewers checking the diff',
    'Bash: DATABASE_URL=.../epigraph_db_repo_test cargo test -p epigraph-db', 'Bash: git commit (security(api): ...)', 'Bash: git push -u origin HEAD',
    'Bash: gh pr create --base ' + INTEG];
  var THOUGHTS = ['The repo layer already has a visibility filter; reusing it keeps SQL out of the route.', 'Test reproduces the leak; now applying the fix.',
    'cargo check is clean; running the targeted tests against the test DB only.', 'Writing .kanban/report.json with the verification output.'];

  function startQueued() {
    var cs = Object.keys(st.cards).map(function (k) { return st.cards[k]; });
    var running = cs.filter(function (c) { return c.status === 'running'; }).length;
    cs.filter(function (c) { return c.status === 'queued'; }).sort(function (a, b) { return (a._q || 0) - (b._q || 0); }).forEach(function (c) {
      if (running >= st.config.max_agents) return;
      c.status = 'running'; c.started_at = new Date().toISOString(); c.finished_at = null;
      c._endAt = Date.now() + 25000 + Math.random() * 20000; c._step = 0;
      c.last_activity = 'Read: CLAUDE.md';
      hist(c, 'started', 'agent session ' + short(c.session_id));
      log(c, 'system', 'init: session ' + c.session_id + ' cwd=' + c.worktree);
      running++;
    });
  }
  function finish(c) {
    c.column = 'review'; c.finished_at = new Date().toISOString(); c._endAt = null;
    c.cost_usd = Math.round((0.8 + Math.random() * 3) * 100) / 100;
    if (!c.pr_number) withPr(c, st.nextPr++);
    c.status = 'awaiting_review';
    c.summary = c.summary || 'Implemented the change scoped to this backlog item and opened PR #' + c.pr_number + ' into ' + c.integration_branch + '.';
    c.verification = c.verification || 'cargo check --workspace  -> ok\ncargo test (epigraph_db_repo_test)  -> all passed';
    c.last_activity = 'Wrote .kanban/report.json';
    log(c, 'result', 'done. PR #' + c.pr_number + ', cost $' + c.cost_usd.toFixed(2));
    hist(c, 'pr_opened', 'PR #' + c.pr_number + ' into ' + c.integration_branch);
    hist(c, 'finished', 'report: done');
  }
  function tick() {
    startQueued();
    Object.keys(st.cards).forEach(function (k) {
      var c = st.cards[k];
      if (c.status !== 'running') return;
      c._step = c._step || 0;
      if (Math.random() < 0.55) {
        var a = ACTS[c._step++ % ACTS.length];
        c.last_activity = a; log(c, 'tool', a);
        if (Math.random() < 0.35) log(c, 'assistant', THOUGHTS[Math.floor(Math.random() * THOUGHTS.length)]);
      }
      if (!c._blk && c._endAt && Date.now() > c._endAt - 15000 && Math.random() < 0.2) {
        c._blk = true;
        c.blockers.push(blk('Scope question: the fix also touches the HTTP route. Keep it in this PR or split it out?', 'warning', 'agent', 0));
        hist(c, 'blocker', 'agent flagged a warning'); log(c, 'assistant', 'Flagged a scope question in .kanban/blockers.jsonl; continuing.');
      }
      if (c._endAt && Date.now() >= c._endAt) finish(c);
    });
  }
  setInterval(tick, 1500);

  function list() { return Object.keys(st.cards).map(function (k) { return st.cards[k]; }); }
  function snapshot() {
    var cards = list();
    return {
      cards: JSON.parse(JSON.stringify(cards, function (k, v) { return k.charAt(0) === '_' ? undefined : v; })),
      integration: st.integration, config: st.config,
      running: cards.filter(function (c) { return c.status === 'running'; }).length,
      queued: cards.filter(function (c) { return c.status === 'queued'; }).length,
      backlog_refresh: st.backlog_refresh, backlog_fetched_at: st.backlog_refresh.fetched_at, backlog_source: st.backlog_source
    };
  }
  function get(id) { var c = st.cards[decodeURIComponent(id)]; if (!c) throw err(404, 'unknown card ' + id); return c; }
  function ensureInteg() {
    if (!st.integration.branch) {
      st.integration = { branch: 'integration/kanban-2026-09-18-2', base: 'main', pr_url: null, pr_number: null, created_at: new Date().toISOString(), status: 'open' };
    }
    return st.integration.branch;
  }

  function handle(method, path, body) {
    var u = new URL(path, 'http://demo.local');
    var p = u.pathname, m;
    if (method === 'GET' && p === '/api/state') return snapshot();
    if (method === 'POST' && p === '/api/backlog/refresh') {
      if (st.backlog_refresh.running) throw err(409, 'refresh already running');
      st.backlog_refresh.running = true;
      setTimeout(function () { st.backlog_refresh.running = false; st.backlog_refresh.fetched_at = new Date().toISOString(); }, 2200);
      return { ok: true };
    }
    if (method === 'POST' && p === '/api/backlog/import') {
      if (!Array.isArray(body)) throw err(400, 'expected a JSON array');
      var added = 0, updated = 0;
      body.forEach(function (cl) {
        if (!cl || !cl.id) return;
        if (st.cards[cl.id]) { st.cards[cl.id].content = cl.content || st.cards[cl.id].content; updated++; }
        else { var c = mk({ content: cl.content || '', created_at: cl.created_at || new Date().toISOString(), truth_value: cl.truth_value }); delete st.cards[c.id]; c.id = cl.id; c.labels = cl.labels || c.labels; st.cards[c.id] = c; added++; }
      });
      return { ok: true, added: added, updated: updated };
    }
    if ((m = p.match(/^\/api\/cards\/([^/]+)\/blockers\/([^/]+)\/resolve$/)) && method === 'POST') {
      var cb = get(m[1]);
      var b = cb.blockers.filter(function (x) { return x.id === decodeURIComponent(m[2]); })[0];
      if (!b) throw err(404, 'unknown blocker');
      b.resolved = true; b.note = (body && body.note) || null;
      hist(cb, 'blocker_resolved', b.text.slice(0, 80) + (b.note ? ' — ' + b.note : ''));
      return { ok: true };
    }
    if ((m = p.match(/^\/api\/cards\/([^/]+)\/(develop|stop|feedback|accept|reject|blockers|log)$/))) {
      var c = get(m[1]), act = m[2];
      if (act === 'log' && method === 'GET') {
        var tail = Number(u.searchParams.get('tail')) || 300;
        return { lines: (logs[c.id] || []).slice(-tail) };
      }
      if (method !== 'POST') throw err(405, 'method not allowed');
      if (act === 'develop') {
        var okFrom = c.column === 'backlog' || c.column === 'review' || c.status === 'failed' || c.status === 'stopped';
        if (!okFrom || c.status === 'running' || c.status === 'queued') throw err(409, 'cannot develop from ' + c.column + '/' + c.status);
        c.integration_branch = c.integration_branch && c.column !== 'backlog' ? c.integration_branch : ensureInteg();
        c.branch = c.branch || 'kanban/' + short(c.id) + '-' + slug(c.title);
        c.worktree = c.worktree || '~/.epigraph-kanban/worktrees/' + short(c.id);
        c.session_id = uid();
        c.column = 'develop'; c.status = 'queued'; c._q = ++st.q; c.finished_at = null; c.last_activity = null; c._blk = false;
        hist(c, 'develop', (body && body.notes) ? 'notes: ' + body.notes : 'dispatched');
        logs[c.id] = logs[c.id] || [];
        log(c, 'system', 'queued; waiting for an agent slot');
        return { ok: true };
      }
      if (act === 'stop') {
        if (!isBusy(c)) throw err(409, 'card is not running');
        c.status = 'stopped'; c.finished_at = new Date().toISOString(); c._endAt = null; c.last_activity = null;
        hist(c, 'stopped', 'process group killed by user'); log(c, 'system', 'SIGTERM sent to process group');
        return { ok: true };
      }
      if (act === 'feedback') {
        if (c.column !== 'review') throw err(409, 'feedback is only allowed from review');
        if (!body || !String(body.text || '').trim()) throw err(400, 'text is required');
        c.column = 'develop'; c.status = 'queued'; c._q = ++st.q; c._blk = true;
        hist(c, 'feedback', body.text); log(c, 'system', 'resuming session ' + c.session_id + ' with reviewer feedback');
        return { ok: true };
      }
      if (act === 'accept') {
        if (c.column !== 'review') throw err(409, 'accept is only allowed from review');
        var open = hardBlockers(c);
        if (open.length && !(body && body.force)) throw err(409, 'card has ' + open.length + ' unresolved blocker(s); pass force to override');
        if (!c.pr_number) throw err(409, 'no PR to merge for this card');
        c.column = 'accepted'; c.status = 'merged';
        hist(c, 'accepted', 'merged PR #' + c.pr_number + ' into ' + c.integration_branch + (body && body.force ? ' (forced)' : ''));
        return { ok: true };
      }
      if (act === 'reject') {
        if (c.column !== 'develop' && c.column !== 'review') throw err(409, 'reject is only allowed from develop or review');
        c.column = 'backlog'; c.status = 'idle'; c._endAt = null; c.last_activity = null;
        hist(c, 'rejected', (body && body.reason) || 'no reason given' + (c.pr_number ? '; PR #' + c.pr_number + ' left open' : ''));
        if (body && body.cleanup) c.worktree = null;
        return { ok: true };
      }
      if (act === 'blockers') {
        if (!body || !String(body.text || '').trim()) throw err(400, 'text is required');
        c.blockers.push(blk(String(body.text), body.severity === 'warning' ? 'warning' : 'blocker', 'user', 0));
        hist(c, 'blocker', 'user flagged: ' + String(body.text).slice(0, 80));
        return { ok: true };
      }
    }
    if (method === 'GET' && p === '/api/integration') {
      var ig = st.integration;
      var members = list().filter(function (c) { return ig.branch && c.integration_branch === ig.branch && c.pr_number && c.column !== 'shipped' && c.column !== 'backlog'; })
        .map(function (c) {
          return { card_id: c.id, title: c.title, pr_number: c.pr_number, pr_url: c.pr_url,
            state: c.column === 'accepted' ? 'MERGED' : 'OPEN',
            checks: c.column === 'accepted' ? 'pass' : (c.status === 'failed' ? 'fail' : (c.column === 'develop' ? 'pending' : 'pass')) };
        });
      return { branch: ig.branch, base: ig.base, pr_url: ig.pr_url, pr_number: ig.pr_number,
        pr_state: ig.pr_number ? 'OPEN' : null, mergeable: ig.pr_number ? 'MERGEABLE' : null, checks: ig.pr_number ? 'pass' : 'none', members: members };
    }
    if (method === 'POST' && p === '/api/integration/open-pr') {
      if (!st.integration.branch) throw err(409, 'no integration branch');
      if (!st.integration.pr_number) { st.integration.pr_number = st.nextPr++; st.integration.pr_url = 'https://github.com/example/epigraph/pull/' + st.integration.pr_number; }
      return { ok: true, pr_url: st.integration.pr_url, pr_number: st.integration.pr_number };
    }
    if (method === 'POST' && p === '/api/integration/merge') {
      if (!st.integration.pr_number) throw err(409, 'open the integration PR first');
      var shipped = list().filter(function (c) { return c.column === 'accepted'; });
      var prn = st.integration.pr_number, brn = st.integration.branch;
      shipped.forEach(function (c) { c.column = 'shipped'; hist(c, 'shipped', brn + ' merged to main (PR #' + prn + ')'); });
      if (!body || body.resolve_backlog !== false) {
        setTimeout(function () { shipped.forEach(function (c) { hist(c, 'backlog_resolved', 'resolve_backlog_item ok'); }); }, 2500);
      }
      st.integration = { branch: '', base: 'main', pr_url: null, pr_number: null, created_at: null, status: 'none' };
      return { ok: true, shipped: shipped.length };
    }
    if (method === 'POST' && p === '/api/integration/new') {
      if (list().some(function (c) { return c.column === 'accepted'; })) throw err(409, 'accepted items have not shipped yet');
      var name = (body && body.name) || 'integration/kanban-2026-09-18-' + (st.nextPr % 7 + 2);
      st.integration = { branch: name, base: 'main', pr_url: null, pr_number: null, created_at: new Date().toISOString(), status: 'open' };
      return { ok: true, branch: name };
    }
    throw err(404, 'not found: ' + method + ' ' + p);
  }
  return { handle: handle };
}

/* ================= boot ================= */
if (DEMO) demo = createDemo();
wire();
setBanner(null);
poll();
// elapsed timers tick between polls (cheap: only cards whose signature changed are rebuilt)
setInterval(function () { if (S && !ui.dragging) renderBoard(); }, 15000);
})();
</script>
</body>
