name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push to a pull request supersedes the run for its previous head: cancel it
# rather than let both hold runners. Pushes to main are never cancelled, so
# every merge commit keeps its own complete run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to a full commit SHA (not a floating tag) so a compromised
# or force-pushed upstream tag cannot silently change what runs in CI. The
# trailing comment records the version the SHA resolved to at pin time.
# dtolnay/rust-toolchain selects the channel from the *ref name*; pinning by SHA
# defeats that, so the channel stays explicit via the `toolchain` input below.
jobs:
  # THE RUST TEST SUITE RUNS AS ONE JOB PER SHARD, IN PARALLEL.
  #
  # It used to be one job: six `cargo test` steps one after the other on one
  # runner. That job took ~200 minutes on main, its cap was raised 90 -> 120 ->
  # 150 -> 210 as the suite grew, and on 2026-11-14 a pull request whose every
  # finished step had passed was cancelled at the 210-minute cap a few minutes
  # short of the end, while two more finished with seven and six minutes to
  # spare. Nothing about that is fixed by a larger cap: the suite is serial
  # because the api, mcp and cli tests share one migrated database, not because
  # the work is inherently sequential.
  #
  # So the unit of isolation is now the JOB: each shard gets its own runner and
  # its own Postgres service container, migrated from empty, and runs its test
  # binaries exactly as before (same `--test-threads`, one cargo invocation,
  # one binary at a time). Shards of the same package never share a database,
  # which is the same guarantee the single job gave two different packages.
  #
  # What runs where is decided by .github/scripts/test-shard.py, which is also
  # what the `plan` job runs to PROVE that the shards of a package cover each
  # of its test targets exactly once. Adding a test file needs no edit here:
  # it is dealt to a shard by name. Adding a crate needs none either: it lands
  # in `workspace-rest`, which is selected by exclusion.
  #
  # `test` (below) is the single required check. It fails unless every shard
  # and every feature-gated check the plan asked for succeeded, so branch
  # protection keeps one stable name however the shards are re-cut.
  #
  # ON A PULL REQUEST ONLY THE AFFECTED SHARDS RUN. The org's GitHub-hosted
  # runners are capped at 20 concurrent jobs for every PR together, and the
  # full plan is 13 shards plus the other jobs, so one PR running everything
  # holds nearly the whole cap. `plan` diffs the PR against its base and keeps
  # the shards of the packages the change can affect: packages with changed
  # files, everything that depends on them, and the test targets whose source
  # scans read a changed file (run together in one `source-scans` shard). A
  # docs-only change runs no shard at all. test-shard.py's docstring has the
  # rules; its `affected --base <ref>` mode prints the selection locally.
  #
  # The FULL plan still runs on every push to main, on the staging and
  # integration PRs (head branch integration/**, staging/**, backlog/base-*,
  # atlas/*-base), on any PR labelled `ci:full` (add the label, then "Re-run
  # all jobs": the label is read live, not from the event), and on any change
  # to migrations/, Cargo.lock, the root Cargo.toml, .github/, rust-toolchain*,
  # .sqlx/ or .cargo/. The coverage check below always runs on the full plan.
  #
  # SELF-HOSTED SHARD RUNNERS (off unless the operator turns them on). Self-
  # hosted runners do not count against the 20-job cap. Set the repository
  # variable SHARD_RUNS_ON to a JSON `runs-on` value, e.g.
  #   gh variable set SHARD_RUNS_ON -R epigraph-io/epigraph \
  #     --body '["self-hosted", "linux", "x64", "epigraph-shard"]'
  # and only the shards move; unset it (`gh variable delete SHARD_RUNS_ON`) to
  # move them back. A pull request from a FORK always gets ubuntu-latest
  # whatever the variable says (test-shard.py `shard_runner`): self-hosted
  # runners must never run a stranger's code on a public repository. Each
  # runner must be Linux with Docker (the Postgres service container),
  # `mold` and Python 3 installed, and one runner per machine or VM (the
  # service binds host port 5432); ephemeral (`--ephemeral`) runners are the
  # safe default. An org runner group does not serve public repositories
  # until its "Allow public repositories" setting is on.
  #
  # PER-PR CAP. The repository variable SHARD_MAX_PARALLEL (a positive
  # integer) caps how many shards of ONE run execute at once, so a single PR
  # cannot take every runner; unset means no cap.
  plan:
    name: Plan test shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The labels are read live (a re-run reuses the original event's).
      issues: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      run: ${{ steps.plan.outputs.run }}
      runs_on: ${{ steps.plan.outputs.runs_on }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # On a pull request HEAD is the test merge commit; its first parent
          # is the base it merged into, so HEAD^1...HEAD is exactly the PR's
          # change. Depth 2 fetches both.
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Unit-test the shard planner
        # The affected-set rules, the fork guard and the job graph below are
        # tested here, where a failure blocks the run (the `python` job is
        # advisory). PyYAML is in the runner image; install it if not.
        run: |
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -y && sudo apt-get install -y python3-yaml; }
          python3 -m unittest discover -s .github/scripts/tests -v
      - name: Check that the shards cover every test target exactly once
        # Fails the run before any shard starts if a test target is in no
        # shard or in two, or if a package's unit tests are in none. It also
        # prints the targets a plain `cargo test -p` would skip for a missing
        # feature, so a new feature-gated test is visible here rather than
        # silently never run, and fails on a whole-tree source scan that is
        # not declared in test-shard.py's WALKERS. Always the full plan.
        run: python3 .github/scripts/test-shard.py check
      - name: Plan the shards for this event
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SHARD_RUNS_ON: ${{ vars.SHARD_RUNS_ON }}
          SHARD_MAX_PARALLEL: ${{ vars.SHARD_MAX_PARALLEL }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            export DIFF_BASE=HEAD^1
            if ! PR_LABELS="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '[.[].name]')"; then
              echo "::warning::could not read the PR's labels; using the event's"
              PR_LABELS="$EVENT_LABELS"
            fi
            export PR_LABELS
          fi
          python3 .github/scripts/test-shard.py ci-plan >> "$GITHUB_OUTPUT"

  test-shard:
    name: test (${{ matrix.shard }})
    needs: plan
    # An affected plan can hold no shard at all (a docs-only change). The job
    # is then skipped rather than started with an empty matrix, which GitHub
    # rejects, and the `test` gate accepts the skip because the plan said so.
    if: ${{ fromJSON(needs.plan.outputs.run)['test-shard'] }}
    # ubuntu-latest unless the operator set SHARD_RUNS_ON; never a self-hosted
    # runner for a fork's PR. Computed and validated by the planner: do not
    # read the variable here, or the fork guard is bypassed.
    runs-on: ${{ fromJSON(needs.plan.outputs.runs_on) }}
    # A shard takes 25-40 minutes (setup and build ~10, tests 10-25). 90 bounds
    # a hang with a named cause and leaves room for a slow runner; if a shard
    # approaches it, add a shard in test-shard.py instead of raising this.
    timeout-minutes: 90
    strategy:
      # Every shard reports. One red shard must not hide a second failure in
      # another, or fixing CI takes one three-hour round trip per failure.
      fail-fast: false
      # SHARD_MAX_PARALLEL, or 256 (GitHub's matrix limit: no cap).
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: epigraph
          POSTGRES_PASSWORD: epigraph
          POSTGRES_DB: epigraph
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://epigraph:epigraph@localhost:5432/epigraph
      # PR-16 (ops F9). `epigraph-migrate` reads MIGRATION_DATABASE_URL and
      # falls back to DATABASE_URL with a WARN, so CI would still pass without
      # this line -- and would then never exercise the variable the deploy path
      # uses. Set it explicitly so the "Run migrations" step below is a real
      # test of the new code path rather than of the fallback.
      #
      # Same DSN as DATABASE_URL here on purpose: the service container's
      # POSTGRES_USER is a superuser, so there is only one credential to give.
      # Splitting the migration role from the application role is a DEPLOYMENT
      # concern (docs/deploy.md) that a single-container CI service cannot
      # model, and pretending otherwise with a second identical-privilege role
      # would assert a separation that is not there.
      MIGRATION_DATABASE_URL: postgres://epigraph:epigraph@localhost:5432/epigraph
      SQLX_OFFLINE: "true"
      # The claim fixtures in crates/epigraph-mcp/tests/common/mod.rs DROP
      # uq_claims_content_hash_agent and run a table-wide dedup DELETE on
      # `claims`. They refuse to run unless the target database looks disposable
      # (`_sqlx_test*` / `*_test`) or this flag is set.
      #
      # epigraph-db's claim_repo_helpers.rs was on this list until its fixtures
      # moved to #[sqlx::test]. It now gets a private database per test, so the
      # pool-construction guard had nothing left to protect and was removed with
      # the shared-pool harness. (The db_is_disposable CLASSIFIER stays in that
      # file — it is the reference implementation the mcp and api copies cite —
      # but nothing in epigraph-db consults this variable any more.)
      #
      # This variable STAYS: epigraph-mcp still needs it.
      #
      # The postgres service above is named `epigraph` — the same name as the
      # long-lived deployment — so no name-based rule can tell them apart. This
      # opt-in is what separates them: the ephemeral service container is torn
      # down with the job, so dropping a constraint in it is harmless. Anyone
      # running these tests locally against a real `epigraph` gets a panic
      # instead, which is how the deployed schema lost the constraint while
      # _sqlx_migrations still recorded migration 013 as applied.
      EPIGRAPH_TEST_DESTRUCTIVE_DB: "1"
      # CI resource mitigations — GitHub-hosted ubuntu-latest is 4 vCPU /
      # 16 GB RAM / ~14 GB disk. Default cargo build + lld link saturates
      # that on a workspace this size; symptoms are intermittent SIGBUS in
      # rust-lld (linker OOM during mmap) and ENOSPC on the host disk.
      #
      # CARGO_BUILD_JOBS=2: cap parallel rustc/link to 2. Each link can be
      # 1–2 GB RSS; 2× ≈ 4 GB worst case, comfortable headroom.
      CARGO_BUILD_JOBS: "2"
      # CARGO_PROFILE_TEST_DEBUG=line-tables-only: keep backtraces, drop the
      # heavy DWARF that bloats each test binary to 100–400 MB. Halves the
      # target/ tree on workspaces of this shape — speeds linking AND
      # reduces disk pressure.
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Install mold (low-memory parallel linker)
        # Replaces rust-lld for the workspace. mold uses dramatically less
        # RAM than lld on multi-binary workspaces — the other half of the
        # linker-OOM fix above. apt's mold on ubuntu-24.04 runners is
        # sufficient (>= 2.x). A self-hosted runner must have mold installed:
        # it is never apt-installed there.
        run: |
          if ! command -v mold >/dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y mold
          fi
          mkdir -p .cargo
          {
            echo ""
            echo "# CI-only: route the workspace through mold. Scoped to the"
            echo "# runner triple so local dev on other platforms is unaffected."
            echo "# Uses the default cc driver (-fuse-ld=mold), no clang required."
            echo "[target.x86_64-unknown-linux-gnu]"
            echo 'rustflags = ["-C", "link-arg=-fuse-ld=mold"]'
          } >> .cargo/config.toml
          mold --version
      - name: Free disk space on /
        # Runs intermittently ENOSPC'd on / during the serialized test phase
        # (observed: "Test (epigraph-api)" → "No space left on device" writing
        # the runner _diag log) at a high enough rate (~85% of PRs) to be
        # systematic, not flaky infra. A df at THIS point shows / with ~107 GB
        # bytes and ~94% inodes free, so the volume is not full pre-build — the
        # consumption happens DURING the per-test #[sqlx::test] phase (postgres
        # template/test DBs in the docker overlay on /, plus test-binary link
        # artifacts), which a pre-build df cannot see. Reclaiming the ~24 GB of
        # preinstalled Android/.NET/GHC/Haskell/hosted-toolcache trees this
        # build never touches gives the test phase enough headroom to finish.
        #
        # NOTE: an earlier attempt set CARGO_TARGET_DIR=/mnt — inert, because the
        # mount table shows no separate /mnt disk (/mnt is a dir on /dev/root).
        # The df -ih / df -h lines record the headroom actually reclaimed.
        #
        # GitHub-hosted only: on a self-hosted runner these directories are
        # the machine's own, and deleting them is not this job's call.
        if: runner.environment == 'github-hosted'
        run: |
          df -ih / ; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost || true
          df -ih / ; df -h /
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          # One dependency cache per PACKAGE, not per shard: the shards of a
          # package build the same dependency graph, and GitHub's cache quota
          # is per repository. Only main writes it, and only one shard per key,
          # so pull requests restore main's cache and never evict it.
          shared-key: test-${{ matrix.cache }}
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.save }}
      # --locked: Cargo.lock is committed; enforce it so CI builds the exact
      # locked dependency graph and fails loudly if the lock is stale rather
      # than silently resolving newer versions.
      - name: Build (whole workspace)
        # The "does everything build and link" gate, once. Clippy type-checks
        # every target, but only a build links the binaries.
        if: matrix.shard == 'workspace-rest'
        run: cargo build --workspace --locked
      - name: Build epigraph-migrate
        if: matrix.shard != 'workspace-rest'
        run: cargo build --locked -p epigraph-api --bin epigraph-migrate
      - name: Run migrations
        # epigraph-ingest-executor's e2e_empty_content_guard test connects to
        # DATABASE_URL directly (no #[sqlx::test] template DB) and queries the
        # `workflows` table. The postgres service starts empty; without this step
        # the non-DB parallel tests fail with "relation workflows does not exist".
        # The epigraph-migrate binary embeds all migrations at compile time
        # (sqlx::migrate!("../../migrations") in epigraph-api/src/lib.rs) so no
        # external sqlx-cli is needed — just run the already-built binary.
        run: ./target/debug/epigraph-migrate
      - name: Test
        if: matrix.shard != 'source-scans'
        # --no-fail-fast: run every test binary of the shard even after one
        # fails, so one run reports every failure in it.
        #
        # `--test-threads` is REQUIRED, not redundant: .cargo/config.toml sets
        # RUST_TEST_THREADS = "1" workspace-wide as the safe default, and
        # libtest's CLI argument is what overrides it. The value per package
        # lives in test-shard.py:
        #   * epigraph-db runs at 4: every test in its tests/ directory
        #     provisions its own database with #[sqlx::test], and the lib arms
        #     that touch the ambient DATABASE_URL are all #[ignore]d. Measured
        #     peak 17 Postgres backends at 4 threads against the service's
        #     default max_connections of 100; re-measure before raising it.
        #     lineage_tests.rs::test_lineage_performance_with_large_graph
        #     asserts an absolute wall-clock bound: do not widen that bound if
        #     it flakes, give it its own shard at one thread.
        #   * everything else runs at 1: the api, mcp, cli and engine suites
        #     share the shard's one migrated database.
        env:
          SHARD: ${{ matrix.shard }}
          THREADS: ${{ matrix.threads }}
        run: |
          args="$(python3 .github/scripts/test-shard.py args "$SHARD")"
          # shellcheck disable=SC2086  # $args is a list of cargo arguments
          cargo test --locked --no-fail-fast $args -- --test-threads="$THREADS"
          doc_package="$(python3 .github/scripts/test-shard.py doc "$SHARD")"
          if [ -n "$doc_package" ]; then
            cargo test --locked -p "$doc_package" --doc
          fi
      - name: Test (source scans)
        # Only in an affected plan: the test targets of packages the change
        # does not otherwise touch whose sources read a changed file (the
        # cross-crate ratchets, the runbook and calibration checks). One
        # cargo invocation per package, at that package's --test-threads.
        if: matrix.shard == 'source-scans'
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          python3 .github/scripts/test-shard.py scan-args "$TARGETS" > "$RUNNER_TEMP/scan-args"
          cat "$RUNNER_TEMP/scan-args"
          status=0
          while read -r threads args; do
            # shellcheck disable=SC2086  # $args is a list of cargo arguments
            cargo test --locked --no-fail-fast $args -- --test-threads="$threads" || status=1
          done < "$RUNNER_TEMP/scan-args"
          exit "$status"

  # TESTS THAT NO PLAIN `cargo test -p` RUNS, as a gate.
  #
  # Until this job existed nothing in CI compiled the `integration` feature or
  # passed --ignored, so these tests ran only when someone remembered to. Each
  # step below was run on a fresh database before being added here and passed.
  # A never-run test rots: the two suites that did NOT pass are in
  # `test-unqualified` below, each with one test that broke unnoticed.
  test-extra:
    name: test (feature-gated and ignored suites)
    # Runs only when epigraph-api or epigraph-jobs is affected
    # (test-shard.py EXTRA_JOBS), and always on a full plan.
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.run)['test-extra'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: epigraph
          POSTGRES_PASSWORD: epigraph
          POSTGRES_DB: epigraph
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Same environment as `test-shard`; the reasons for each value are there.
      DATABASE_URL: postgres://epigraph:epigraph@localhost:5432/epigraph
      MIGRATION_DATABASE_URL: postgres://epigraph:epigraph@localhost:5432/epigraph
      SQLX_OFFLINE: "true"
      EPIGRAPH_TEST_DESTRUCTIVE_DB: "1"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Install mold (low-memory parallel linker)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mold
          mkdir -p .cargo
          {
            echo ""
            echo "# CI-only: route the workspace through mold. Scoped to the"
            echo "# runner triple so local dev on other platforms is unaffected."
            echo "# Uses the default cc driver (-fuse-ld=mold), no clang required."
            echo "[target.x86_64-unknown-linux-gnu]"
            echo 'rustflags = ["-C", "link-arg=-fuse-ld=mold"]'
          } >> .cargo/config.toml
          mold --version
      - name: Free disk space on /
        run: |
          df -ih / ; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost || true
          df -ih / ; df -h /
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          shared-key: test-extra
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build epigraph-migrate
        run: cargo build --locked -p epigraph-api --bin epigraph-migrate
      - name: Run migrations
        run: ./target/debug/epigraph-migrate
      - name: epigraph-api `integration` feature tests
        # tests/integration/lineage_integration_tests.rs and
        # tests/routes/semantic_search_tests.rs are compiled only with
        # `--features integration` (backlog 8fbe1b43).
        run: >-
          cargo test -p epigraph-api --features integration --locked --no-fail-fast
          --test lineage_integration_tests --test semantic_search_tests
          -- --test-threads=1
      - name: epigraph-jobs `integration` feature tests
        # The integration-gated arms of postgres_queue_tests and the whole of
        # cluster_graph_neighborhoods_test. cluster_graph_test's gated arm is
        # in `test-unqualified` until backlog bd439a7f is fixed.
        run: >-
          cargo test -p epigraph-jobs --features integration --locked --no-fail-fast
          --test postgres_queue_tests --test cluster_graph_neighborhoods_test
          -- --test-threads=1
      - name: OAuth authorization-code tests marked #[ignore]
        # 13 tests in tests/oauth_authorization_code.rs are
        # `#[ignore = "requires DATABASE_URL test DB"]`: the code-redeem,
        # consent and dynamic-client-registration paths (backlog d0c23a32).
        # This job has that database. `--ignored` runs only those; the rest of
        # the file runs in its api shard.
        run: >-
          cargo test -p epigraph-api --locked --no-fail-fast
          --test oauth_authorization_code
          -- --ignored --test-threads=1

  # NEVER-RUN SUITES THAT DO NOT PASS YET. Advisory, like `python` and `audit`:
  # red here does not block a merge, but it is no longer invisible.
  #
  # Each of the two steps has exactly one failing test, both stale rather than
  # known product defects:
  #   * cluster_graph_test's seed fixture inserts edges without owner_group_id,
  #     which tenancy made NOT NULL (backlog bd439a7f).
  #   * sheaf_db.rs hard-codes restriction factors the engine no longer uses
  #     (backlog 4290a51c).
  # When one is fixed, move its step up into `test-extra` so it gates. Do not
  # add `--skip` for the failing test: a skipped test is a never-run test.
  test-unqualified:
    name: Never-run suites (advisory)
    # Runs only when epigraph-jobs or engine-integration-tests is affected
    # (test-shard.py EXTRA_JOBS), and always on a full plan.
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.run)['test-unqualified'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: epigraph
          POSTGRES_PASSWORD: epigraph
          POSTGRES_DB: epigraph
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Same environment as `test-shard`; the reasons for each value are there.
      DATABASE_URL: postgres://epigraph:epigraph@localhost:5432/epigraph
      MIGRATION_DATABASE_URL: postgres://epigraph:epigraph@localhost:5432/epigraph
      SQLX_OFFLINE: "true"
      EPIGRAPH_TEST_DESTRUCTIVE_DB: "1"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Install mold (low-memory parallel linker)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mold
          mkdir -p .cargo
          {
            echo ""
            echo "# CI-only: route the workspace through mold. Scoped to the"
            echo "# runner triple so local dev on other platforms is unaffected."
            echo "# Uses the default cc driver (-fuse-ld=mold), no clang required."
            echo "[target.x86_64-unknown-linux-gnu]"
            echo 'rustflags = ["-C", "link-arg=-fuse-ld=mold"]'
          } >> .cargo/config.toml
          mold --version
      - name: Free disk space on /
        run: |
          df -ih / ; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost || true
          df -ih / ; df -h /
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          shared-key: test-extra
          save-if: false
      - name: Build epigraph-migrate
        run: cargo build --locked -p epigraph-api --bin epigraph-migrate
      - name: Run migrations
        run: ./target/debug/epigraph-migrate
      - name: epigraph-jobs cluster_graph_test with `integration`
        if: always()
        run: >-
          cargo test -p epigraph-jobs --features integration --locked --no-fail-fast
          --test cluster_graph_test
          -- --test-threads=1
      - name: engine-integration suite including #[ignore]d tests
        # Every DB-backed test in tests/engine-integration is #[ignore]d, so
        # the `workspace-rest` shard compiles the suite and runs none of it.
        if: always()
        run: >-
          cargo test -p engine-integration-tests --locked --no-fail-fast
          -- --include-ignored --test-threads=1

  # The one required check for the Rust suite. `needs` lists every job whose
  # failure must block a merge. Without an `if`, a job whose dependency failed
  # is SKIPPED, and a skipped required check reads as "pending" forever; so
  # this job runs whenever the RUN was not cancelled, and fails on anything
  # but `success` from any dependency (a shard that hit its own timeout
  # reports `cancelled` and fails it, as it should).
  #
  # `!cancelled()`, not `always()`: when a new push supersedes this run the
  # `concurrency` rule above cancels it, and with `always()` this job then ran
  # anyway and posted a red `test` on the superseded commit.
  #
  # A job the plan skipped (no affected shard, or no affected package for a
  # feature-gated check) must be `skipped`, and passes; a job the plan asked
  # for must be `success`; nothing passes unless `plan` succeeded. The rule is
  # test-shard.py `gate`, unit-tested in `plan`.
  test:
    name: test
    if: ${{ !cancelled() }}
    needs: [plan, test-shard, test-extra, lint-features]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Every shard and feature check the plan asked for succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/test-shard.py gate

  # Clippy, Format check and the no-db build check run in their OWN job, on
  # their own runner, in parallel with `test`. On a staging-sized tree the test
  # steps alone took ~111 of the job's 120 minutes and filled the runner's disk,
  # so the static checks that used to run after them were cut at the cap (or died
  # with "No space left on device") and never reported. Split, they report in
  # about 15 minutes whatever the test phase does, and `test` keeps its budget.
  # No database: none of the three needs one (sqlx offline mode).
  lint:
    name: Lint (clippy, fmt, no-db)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: postgres://epigraph:epigraph@localhost:5432/epigraph
      # PR-16 (ops F9). `epigraph-migrate` reads MIGRATION_DATABASE_URL and
      # falls back to DATABASE_URL with a WARN, so CI would still pass without
      # this line -- and would then never exercise the variable the deploy path
      # uses. Set it explicitly so the "Run migrations" step below is a real
      # test of the new code path rather than of the fallback.
      #
      # Same DSN as DATABASE_URL here on purpose: the service container's
      # POSTGRES_USER is a superuser, so there is only one credential to give.
      # Splitting the migration role from the application role is a DEPLOYMENT
      # concern (docs/deploy.md) that a single-container CI service cannot
      # model, and pretending otherwise with a second identical-privilege role
      # would assert a separation that is not there.
      MIGRATION_DATABASE_URL: postgres://epigraph:epigraph@localhost:5432/epigraph
      SQLX_OFFLINE: "true"
      # The claim fixtures in crates/epigraph-mcp/tests/common/mod.rs DROP
      # uq_claims_content_hash_agent and run a table-wide dedup DELETE on
      # `claims`. They refuse to run unless the target database looks disposable
      # (`_sqlx_test*` / `*_test`) or this flag is set.
      #
      # epigraph-db's claim_repo_helpers.rs was on this list until its fixtures
      # moved to #[sqlx::test]. It now gets a private database per test, so the
      # pool-construction guard had nothing left to protect and was removed with
      # the shared-pool harness. (The db_is_disposable CLASSIFIER stays in that
      # file — it is the reference implementation the mcp and api copies cite —
      # but nothing in epigraph-db consults this variable any more.)
      #
      # This variable STAYS: epigraph-mcp still needs it.
      #
      # The postgres service above is named `epigraph` — the same name as the
      # long-lived deployment — so no name-based rule can tell them apart. This
      # opt-in is what separates them: the ephemeral service container is torn
      # down with the job, so dropping a constraint in it is harmless. Anyone
      # running these tests locally against a real `epigraph` gets a panic
      # instead, which is how the deployed schema lost the constraint while
      # _sqlx_migrations still recorded migration 013 as applied.
      EPIGRAPH_TEST_DESTRUCTIVE_DB: "1"
      # CI resource mitigations — GitHub-hosted ubuntu-latest is 4 vCPU /
      # 16 GB RAM / ~14 GB disk. Default cargo build + lld link saturates
      # that on a workspace this size; symptoms are intermittent SIGBUS in
      # rust-lld (linker OOM during mmap) and ENOSPC on the host disk.
      #
      # CARGO_BUILD_JOBS=2: cap parallel rustc/link to 2. Each link can be
      # 1–2 GB RSS; 2× ≈ 4 GB worst case, comfortable headroom.
      CARGO_BUILD_JOBS: "2"
      # CARGO_PROFILE_TEST_DEBUG=line-tables-only: keep backtraces, drop the
      # heavy DWARF that bloats each test binary to 100–400 MB. Halves the
      # target/ tree on workspaces of this shape — speeds linking AND
      # reduces disk pressure.
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Install mold (low-memory parallel linker)
        # Replaces rust-lld for the workspace. mold uses dramatically less
        # RAM than lld on multi-binary workspaces — the other half of the
        # linker-OOM fix above. apt's mold on ubuntu-24.04 runners is
        # sufficient (>= 2.x).
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mold
          mkdir -p .cargo
          {
            echo ""
            echo "# CI-only: route the workspace through mold. Scoped to the"
            echo "# runner triple so local dev on other platforms is unaffected."
            echo "# Uses the default cc driver (-fuse-ld=mold), no clang required."
            echo "[target.x86_64-unknown-linux-gnu]"
            echo 'rustflags = ["-C", "link-arg=-fuse-ld=mold"]'
          } >> .cargo/config.toml
          mold --version
      - name: Free disk space on /
        # Runs intermittently ENOSPC'd on / during the serialized test phase
        # (observed: "Test (epigraph-api)" → "No space left on device" writing
        # the runner _diag log) at a high enough rate (~85% of PRs) to be
        # systematic, not flaky infra. A df at THIS point shows / with ~107 GB
        # bytes and ~94% inodes free, so the volume is not full pre-build — the
        # consumption happens DURING the per-test #[sqlx::test] phase (postgres
        # template/test DBs in the docker overlay on /, plus test-binary link
        # artifacts), which a pre-build df cannot see. Reclaiming the ~24 GB of
        # preinstalled Android/.NET/GHC/Haskell/hosted-toolcache trees this
        # build never touches gives the test phase enough headroom to finish.
        #
        # NOTE: an earlier attempt set CARGO_TARGET_DIR=/mnt — inert, because the
        # mount table shows no separate /mnt disk (/mnt is a dir on /dev/root).
        # The df -ih / df -h lines record the headroom actually reclaimed.
        run: |
          df -ih / ; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost || true
          df -ih / ; df -h /
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Clippy
        # --all-targets is load-bearing, not cosmetic. Without it cargo lints
        # only lib+bin targets, so `tests/`, `examples/` and `benches/` are
        # never compiled by this gate — `touch`ing an example or an integration
        # test and re-running produced "Finished ... 0.14s" with nothing
        # rebuilt. That blind spot is how a backlog of clippy failures
        # accumulated in the test/example targets unnoticed.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Format check
        run: cargo fmt --check
      - name: No-db build check
        # epigraph-api's `db` feature is default-on and nothing else in this
        # file builds the crate without it. That blind spot is exactly how the
        # no-db variant silently stopped compiling: 28 name-resolution errors
        # accumulated between 2026-05-08 and 2026-08-20 with no signal, and the
        # first proposed fix was to delete the variant because "nothing depends
        # on it". This step is the missing signal. It is cheap (check, not
        # build) and fails the moment a db-only item lands without its
        # `#[cfg(not(feature = "db"))]` counterpart.
        #
        # Scope is deliberately lib+bins, NOT --all-targets: the crate's
        # [dev-dependencies] on epigraph-db and sqlx are non-optional, so the
        # test targets link Postgres regardless of the feature flag and cannot
        # pass under --no-default-features today. Every bin, `server`
        # included, declares required-features = ["db"] (ruling R-39: not(db)
        # is check-only), so in practice this checks the library.
        run: cargo check -p epigraph-api --no-default-features --locked

  # The feature-gated checks, on their own runner. They used to follow Clippy
  # in the `lint` job, which made that job (45 minutes) the longest in the
  # workflow once the test suite was sharded. None of them needs the others'
  # build products: each compiles a different feature set.
  lint-features:
    name: Lint (genai and tls features)
    # Runs only when epigraph-api or epigraph-cli is affected
    # (test-shard.py EXTRA_JOBS), and always on a full plan.
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.run)['lint-features'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: postgres://epigraph:epigraph@localhost:5432/epigraph
      MIGRATION_DATABASE_URL: postgres://epigraph:epigraph@localhost:5432/epigraph
      SQLX_OFFLINE: "true"
      EPIGRAPH_TEST_DESTRUCTIVE_DB: "1"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Install mold (low-memory parallel linker)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mold
          mkdir -p .cargo
          {
            echo ""
            echo "# CI-only: route the workspace through mold. Scoped to the"
            echo "# runner triple so local dev on other platforms is unaffected."
            echo "# Uses the default cc driver (-fuse-ld=mold), no clang required."
            echo "[target.x86_64-unknown-linux-gnu]"
            echo 'rustflags = ["-C", "link-arg=-fuse-ld=mold"]'
          } >> .cargo/config.toml
          mold --version
      - name: Free disk space on /
        run: |
          df -ih / ; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost || true
          df -ih / ; df -h /
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Genai feature build check
        # `genai` is off by default and no other step compiles it, so its code
        # had no compile-time signal: epigraph-api's POST
        # /api/v1/analyze/unconstrained handler (whose provider errors must go
        # through llm_unavailable) was pinned only by a source-scan test, and
        # epigraph-cli's genai-gated bins and tests were never built (backlog
        # e0f0cb68). One invocation per package, NOT `-p a -p b`: api's `genai`
        # does not enable epigraph-cli's, so a combined run would unify
        # features and could hide a break that only api-alone shows.
        run: |
          cargo clippy -p epigraph-api --features genai --all-targets --locked -- -D warnings
          cargo clippy -p epigraph-cli --features genai --all-targets --locked -- -D warnings
      - name: TLS feature clippy
        # `tls` (axum-server + rustls: src/tls.rs's PEM loader and its explicit
        # crypto-provider choice) is off by default and no other step enables
        # it, so that code and its two tests had no compile or lint signal
        # (backlog ed3fff02). The workspace Clippy step above passes with a
        # clippy-only defect in the tls-gated impl; this one refuses it.
        run: cargo clippy -p epigraph-api --features tls --all-targets --locked -- -D warnings
      - name: TLS feature tests
        # tests/tls_pem_loading.rs and tests/tls_provider_choice.rs declare
        # required-features = ["tls"], so every other test step skips them.
        # No database: they handshake against the loaded config in-process.
        run: cargo test -p epigraph-api --features tls --locked --test tls_pem_loading --test tls_provider_choice
      - name: Genai feature tests
        # tests/cross_source_sweep_smoke.rs declares required-features =
        # ["genai"], so no other step runs it; the Genai step above only lints
        # it. It needs no database and no API key: it runs the built
        # `cross_source_sweep` binary's argument handling.
        run: cargo test -p epigraph-cli --features genai --locked --test cross_source_sweep_smoke

  # services/kanban is standard-library-only Python with its own end-to-end
  # suite (stub `gh`/`claude` binaries, a throwaway local git origin, `urlopen`
  # patched). Without this job that suite ran only at author time. Nothing in it
  # reaches GitHub, the EpiGraph API or a real `claude`, so it needs no secrets,
  # no service container and no toolchain beyond the runner's own python3 --
  # hence no extra (unpinned-by-SHA) setup action either.
  kanban:
    name: Kanban board tests
    runs-on: ubuntu-latest
    # The suite takes well under a minute; 15 cuts off a hung stub or agent.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/kanban
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Python version
        run: python3 --version
      - name: Run kanban tests
        run: python3 -m unittest discover -s tests -v

  # The Python suites: scripts/tests (the operator scripts' unit tests, incl.
  # test_fuzzy_dedup_claims.py), tests/dedup (fuzzy_dedup_claims.py driven end
  # to end against a migrated database), tests/theme, and the SciFact
  # calibration fixtures in tests/scifact_calibration. Before this job they ran
  # only at author time (backlogs d5781a48, 733df577). They need a database migrated like the deployed
  # schema, so the job builds `epigraph-migrate` and migrates a separate
  # `epigraph_py_test` database: tests/dedup refuses any database whose name does
  # not end in `_test`. It also builds `ingest_git`, which
  # test_git_ingest_reconciler.py's integration arm drives. Both URLs below are
  # derived from DATABASE_URL, and epigraph-migrate reads MIGRATION_DATABASE_URL
  # first, so the migrate step sets both.
  #
  # EPIGRAPH_PYTEST_REQUIRE_DB=1 turns "test DB unavailable" from a skip into a
  # failure, so an unprovisioned database cannot leave the job green with its
  # database arms skipped. Every pytest step also enforces a skip budget:
  # tests/ci/pytest_skip_budget.py reads the run's JUnit XML and fails the step
  # on any skip not named in its --allow list, which also covers skips the flag
  # does not govern (e.g. test_git_ingest_reconciler's integration arm when it
  # cannot find the ingest_git binary built above). The one allowed skip is
  # test_executed_dedup_removes_the_duplicate_from_recall: it needs a running
  # API and a bearer token (DEDUP_TEST_API_BASE / DEDUP_TEST_TOKEN), which this
  # job does not provide yet, so that arm does not run in CI.
  #
  # The database arms connect as the service container's superuser, so RLS is
  # bypassed: they verify the scripts' logic against the migrated schema, not
  # role or tenancy scoping (a script run as a non-superuser role seeing only
  # part of the rows is outside what they can catch).
  #
  # Advisory at first (continue-on-error, the `audit` precedent): promote it to
  # a hard gate once it has been stable on main.
  python:
    name: Python tests (advisory)
    # Pinned, not ubuntu-latest: tests/requirements-ci.txt pins wheels built
    # for the image's system python3 (3.12; numpy 1.26.4 has none past cp312),
    # so a newer default image would turn the install into a source build.
    runs-on: ubuntu-24.04
    # A cold debug build of the two binaries plus the suites; 60 cuts off a hang.
    timeout-minutes: 60
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: epigraph
          POSTGRES_PASSWORD: epigraph
          POSTGRES_DB: epigraph
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://epigraph:epigraph@localhost:5432/epigraph
      MIGRATION_DATABASE_URL: postgres://epigraph:epigraph@localhost:5432/epigraph
      SQLX_OFFLINE: "true"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          # Save only from main: PR runs restore main's entry but do not add
          # their own, so this job's cache cannot churn the shared Actions cache
          # budget the `test` job's (much larger) entry depends on.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build epigraph-migrate and ingest_git
        run: cargo build --locked -p epigraph-api --bin epigraph-migrate -p epigraph-cli --bin ingest_git
      - name: Install Python test dependencies
        # A venv, not the system interpreter (PEP 668), from a pinned file, and
        # no extra setup action (the trust surface stays the pinned actions).
        run: |
          python3 -m venv "$RUNNER_TEMP/pyenv"
          "$RUNNER_TEMP/pyenv/bin/pip" install --quiet -r tests/requirements-ci.txt
          echo "$RUNNER_TEMP/pyenv/bin" >> "$GITHUB_PATH"
      - name: Create and migrate the Python test database
        run: |
          python3 - <<'PY'
          import os, psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute("DROP DATABASE IF EXISTS epigraph_py_test")
              cur.execute("CREATE DATABASE epigraph_py_test")
          PY
          export DATABASE_URL="${DATABASE_URL%/*}/epigraph_py_test"
          export MIGRATION_DATABASE_URL="$DATABASE_URL"
          ./target/debug/epigraph-migrate
      - name: Python tests (scripts/tests, tests/dedup)
        run: |
          export DEDUP_TEST_DATABASE_URL="${DATABASE_URL%/*}/epigraph_py_test"
          export EPIGRAPH_PYTEST_REQUIRE_DB=1
          python3 -m pytest -rs scripts/tests tests/dedup --junitxml "$RUNNER_TEMP/pytest-scripts-dedup.xml"
          python3 tests/ci/pytest_skip_budget.py "$RUNNER_TEMP/pytest-scripts-dedup.xml" \
            --allow tests.dedup.test_fuzzy_dedup_retraction::test_executed_dedup_removes_the_duplicate_from_recall
      - name: Python tests (tests/theme)
        # The theme pipeline's pytest files. Their DB fixture wipes the
        # clustering tables of the database it is given, which here is the
        # job's own epigraph_py_test.
        run: |
          export THEME_TEST_DATABASE_URL="${DATABASE_URL%/*}/epigraph_py_test"
          export EPIGRAPH_PYTEST_REQUIRE_DB=1
          python3 -m pytest -rs tests/theme --junitxml "$RUNNER_TEMP/pytest-theme.xml"
          python3 tests/ci/pytest_skip_budget.py "$RUNNER_TEMP/pytest-theme.xml"
      - name: Python tests (NLI stance client and service)
        # scripts/lib/test_nli_stance.py and the services/nli stub tests ran
        # nowhere (backlog 4ea6edba). The service's web dependencies are
        # installed at the versions services/nli/requirements.txt pins; its
        # model dependencies (torch, transformers) are not, so
        # test_model_smoke.py, which downloads a model, stays out.
        run: |
          "$RUNNER_TEMP/pyenv/bin/pip" install --quiet fastapi==0.111.0 pydantic==2.7.4
          python3 -m pytest -rs scripts/lib/test_nli_stance.py \
            services/nli/test_app.py services/nli/test_requirements_floor.py
      - name: SciFact conformal calibration check
        # The 1,189 gold-labelled SciFact fixtures: held-out split-conformal
        # coverage and efficiency, plus --check, which fails when the shipped
        # calibration.toml [conformal] quantiles (or the comment stating their
        # calibration n) disagree with a refit of the fixtures (backlog 733df577).
        # The job's database-free pytest files run here too (a new step name
        # would need a matching local-gate classification): tests/ci, the
        # skip-budget checker's own tests, and tests/scifact_calibration, which
        # feeds altered copies of calibration.toml to --check. Both exist so a
        # change that made either checker vacuous fails this step instead of
        # leaving the job green (in CI --check otherwise only sees the faithful
        # file).
        run: |
          python3 -m pytest -rs tests/ci tests/scifact_calibration --junitxml "$RUNNER_TEMP/pytest-ci.xml"
          python3 tests/ci/pytest_skip_budget.py "$RUNNER_TEMP/pytest-ci.xml"
          python3 tests/scifact_calibration/test_conformal_coverage.py --check

  # Advisory, NOT a merge gate. cargo audit checks Cargo.lock against the
  # RustSec DB fetched at run time, so a blocking gate would red-light every
  # open PR the moment a new advisory lands on any transitive dependency —
  # and Foreman auto-merges epigraph PRs, so unrelated red CI is actively
  # harmful. continue-on-error keeps the result visible without blocking.
  # Known advisories are triaged in `.cargo/audit.toml` (tracked: EpiGraph
  # backlog a2fa31b1 — sqlx 0.7->0.8 + reqwest 0.11->0.12 migrations), so the
  # job is GREEN on current advisories and a genuinely NEW one still turns it
  # red. It stays advisory (continue-on-error) by design — not a gate.
  audit:
    name: Security audit (advisory)
    runs-on: ubuntu-latest
    # Same bound as `test`. `continue-on-error` makes a FAILURE advisory; it
    # does nothing about a HANG, which still occupies a runner for six hours.
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      # Installed from source rather than via a prebuilt-binary action so the
      # trust surface stays the three actions pinned above — no extra upstream.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  # Secret scan, a HARD gate (no continue-on-error). epigraph is a public repo,
  # so a credential committed on a PR branch is published the moment it is
  # pushed; this job catches it before it reaches main. It scans ONLY the
  # commits the PR (or the push to main) adds — .github/scripts/gitleaks-scan.sh
  # — so history that predates the job can never fail it; the full-history
  # audit is an operator step documented at the top of .gitleaks.toml.
  # Findings are printed redacted (CI logs of a public repo are public).
  #
  # The gitleaks binary is a release tarball pinned by version AND sha256
  # rather than gitleaks/gitleaks-action: the action requires a
  # GITLEAKS_LICENSE secret for repositories owned by an organization, and the
  # checksum pin gives the same tamper-resistance as the SHA-pinned actions
  # above. The self-test step proves the config still has the properties the
  # scan relies on (range-only, value-scoped fixture allowlist, default rules
  # active) before the scan's verdict is trusted.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # Install + self-test + scan take well under a minute.
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The PR's base commit must be present for a <base>..<head> range.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          tarball="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Self-test the scan config
        run: .github/scripts/test-gitleaks-scan.sh
      - name: Scan the commits this change adds
        env:
          # SHAs reach the script through env, never interpolated into the
          # shell body. On a push, `before` is all zeros when the push created
          # the branch; the script then scans the head commit alone.
          SCAN_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/gitleaks-scan.sh "$SCAN_BASE" "$SCAN_HEAD"
